<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js"></script>
  </head>
  <body>
    <h1 id="heading">Add Restaurant</h1>

    <div>
      <label for="name">Name : </label>
      <input type="text" id="name" />
    </div>

    <div>
      <label for="city">City : </label>
      <input type="text" id="city" />
    </div>

    <div>
      <label for="address">Address : </label>
      <input type="text" id="address" />
    </div>

    <div>
      <label for="cuisine">Cuisine : </label>
      <input type="text" id="cuisine" />
    </div>

    <div>
      <label for="rating">Rating (0-5) : </label>
      <input type="number" id="rating" min="0" max="5" step="0.1" />
    </div>

    <br />

    <div>
      <button onclick="handleSubmit()">Submit</button>
      <button onclick="location.href = 'restaurants.html'">Back</button>
    </div>

    <script>
      // ?id=... means we are editing, no id means adding
      const id = new URLSearchParams(location.search).get("id");
      const fields = ["name", "city", "address", "cuisine", "rating"];

      function loadRestaurant() {
        document.getElementById("heading").textContent = "Edit Restaurant";

        callApi(`/restaurants/${id}`)
          .then(({ response, data }) => {
            console.log(data);

            if (response.status !== 200) {
              showError(data.message || "could not load restaurant!");
              return;
            }

            fields.forEach((field) => {
              document.getElementById(field).value = data[field];
            });
          })
          .catch((error) => {
            console.log(error);
            showError("could not reach the server!");
          });
      }

      function handleSubmit() {
        const body = {};
        fields.forEach((field) => {
          body[field] = document.getElementById(field).value;
        });

        // empty box -> undefined so the API says "rating is required!"
        body.rating = body.rating === "" ? undefined : Number(body.rating);

        const request = id
          ? callApi(`/restaurants/${id}`, "PUT", body)
          : callApi("/restaurants", "POST", body);

        request
          .then(({ response, data }) => {
            console.log(data);

            if (handleUnauthorized(response, data)) {
              return;
            }

            if (response.status === 200 || response.status === 201) {
              showSuccess(data.message).then(() => {
                location.href = "restaurants.html";
              });
            } else {
              showError(data.message || "Something went wrong!");
            }
          })
          .catch((error) => {
            console.log(error);
            showError("could not reach the server!");
          });
      }

      if (requireLogin() && id) {
        loadRestaurant();
      }
    </script>
  </body>
</html>
